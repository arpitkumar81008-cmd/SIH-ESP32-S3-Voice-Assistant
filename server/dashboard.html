<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32-S3 Voice Assistant - Live Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.6)); }
      50% { opacity: 0.6; filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.2)); }
    }
    .streaming-glow { animation: pulse-glow 1.2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 font-sans">
  <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6 text-center">
    
    <!-- Title & Connection Pill -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="text-left">
        <h1 class="text-lg font-bold text-white tracking-wide">ESP32-S3 Voice Assistant</h1>
        <p class="text-xs text-slate-400">Edge KWS ➔ Server Audio Pipeline</p>
      </div>
      <div id="connPill" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">
        ● Server Connected
      </div>
    </div>

    <!-- Main Dynamic Status Banner -->
    <div id="statusCard" class="py-10 px-6 rounded-xl border transition-all duration-300 bg-slate-950 border-slate-800 flex flex-col items-center justify-center gap-3 min-h-[160px]">
      <div id="statusDot" class="w-4 h-4 rounded-full bg-slate-600 transition-all"></div>
      <h2 id="statusText" class="text-xl font-semibold text-slate-400 tracking-tight transition-all">
        Waiting for wake word...
      </h2>
      <p id="subStatusText" class="text-xs text-slate-400">Say "Ankit" or press the trigger button</p>
    </div>

    <!-- Live Transcript Box -->
    <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-left space-y-1 min-h-[70px]">
      <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Latest Transcript</div>
      <p id="transcriptText" class="text-base font-medium text-slate-200 italic">No audio transcribed yet.</p>
    </div>

    <!-- Footer Controls -->
    <div class="flex items-center justify-between pt-2">
      <span id="latencyInfo" class="text-xs text-slate-400 font-mono">E2E Latency: --</span>
      <button onclick="triggerESP()" class="px-4 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-lg text-xs font-bold transition shadow-md active:scale-95 cursor-pointer">
        🎙️ Test Trigger (BOOT)
      </button>
    </div>

  </div>

  <script>
    const baseUrl = (window.location.protocol === 'http:' || window.location.protocol === 'https:') ? '' : 'http://localhost:8080';
    const statusCard = document.getElementById('statusCard');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const subStatusText = document.getElementById('subStatusText');
    const transcriptText = document.getElementById('transcriptText');
    const latencyInfo = document.getElementById('latencyInfo');
    const connPill = document.getElementById('connPill');

    function setIdle() {
      statusCard.className = 'py-10 px-6 rounded-xl border transition-all duration-300 bg-slate-950 border-slate-800 flex flex-col items-center justify-center gap-3 min-h-[160px]';
      statusDot.className = 'w-4 h-4 rounded-full bg-slate-500';
      statusText.className = 'text-xl font-semibold text-slate-400 tracking-tight';
      statusText.innerText = 'Waiting for wake word...';
      subStatusText.innerText = 'Say "Ankit" or press the trigger button';
    }

    function setStreaming() {
      statusCard.className = 'py-10 px-6 rounded-xl border transition-all duration-300 bg-emerald-950/60 border-emerald-500 flex flex-col items-center justify-center gap-3 min-h-[160px] streaming-glow';
      statusDot.className = 'w-4 h-4 rounded-full bg-emerald-400 animate-ping';
      statusText.className = 'text-xl font-bold text-emerald-300 tracking-tight';
      statusText.innerText = 'WebSocket open, wake word detected, audio streaming.';
      subStatusText.innerText = 'Streaming microphone PCM audio to server...';
    }

    function setTranscribing() {
      statusCard.className = 'py-10 px-6 rounded-xl border transition-all duration-300 bg-amber-950/50 border-amber-500 flex flex-col items-center justify-center gap-3 min-h-[160px]';
      statusDot.className = 'w-4 h-4 rounded-full bg-amber-400 animate-pulse';
      statusText.className = 'text-xl font-semibold text-amber-300 tracking-tight';
      statusText.innerText = '⚡ Processing Audio (Faster-Whisper ASR)...';
      subStatusText.innerText = 'Transcribing voice utterance...';
    }

    // Connect to Server Events (SSE)
    const evtSource = new EventSource(baseUrl + '/events');

    evtSource.onopen = () => {
      connPill.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800';
      connPill.innerText = '● Server Connected';
    };

    evtSource.onerror = () => {
      connPill.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-red-950 text-red-400 border border-red-800';
      connPill.innerText = '○ Reconnecting...';
    };

    evtSource.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') {
          if (msg.state === 'STREAMING') {
            setStreaming();
          } else if (msg.state === 'TRANSCRIBING') {
            setTranscribing();
          } else if (msg.state === 'IDLE') {
            setIdle();
          }
        } else if (msg.type === 'result') {
          const res = msg.data;
          if (res && res.transcript) {
            transcriptText.innerText = '"' + res.transcript + '"';
            transcriptText.className = 'text-base font-medium text-emerald-300';
            latencyInfo.innerText = 'Whisper: ' + (res.whisper_latency_ms || 0) + 'ms | Total E2E: ' + (res.total_e2e_latency_ms || 0) + 'ms';
          }
        }
      } catch (err) {
        console.error('SSE parse error:', err);
      }
    };

    async function triggerESP() {
      try {
        await fetch(baseUrl + '/api/trigger', { method: 'POST' });
      } catch (err) {
        console.error('Trigger error:', err);
      }
    }
  </script>
</body>
</html>
